<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#123b40">
<meta name="description" content="Biblioteca organizada de ferramentas online.">
<title>Daily Tools | Ferramentas Online</title>
<link rel="stylesheet" href="/assets/bootstrap-icons/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/app.js" defer></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <i class="bi bi-grid-3x3-gap"></i>
      <strong>Daily Tools</strong>
    </div>
    <span class="topbar-label">Biblioteca de ferramentas online</span>
  </div>
</header>

<main class="container">

  <section class="toolbar">
    <div class="search-box">
      <i class="bi bi-search"></i>
      <input id="search" type="search"
        placeholder="Pesquisar ferramentas ou funcionalidades..."
        autocomplete="off"
        aria-label="Pesquisar ferramentas">
      <button id="clearSearch" type="button" title="Limpar pesquisa" aria-label="Limpar pesquisa">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="toolbar-bottom">
      <span id="resultCount" aria-live="polite">Carregando catálogo...</span>
      <button id="clearFilters" type="button">
        <i class="bi bi-arrow-counterclockwise"></i>
        Limpar filtros
      </button>
    </div>
  </section>

  <section class="category-area">
    <div class="area-title">
      <h2>Categorias</h2>
      <span id="categoryCount"></span>
    </div>
    <nav id="categories" class="categories" aria-label="Filtrar ferramentas por categoria"></nav>
  </section>

  <section class="results">
    <div class="area-title">
      <h2 id="currentCategory">Todas as ferramentas</h2>
      <select id="sort" aria-label="Ordenar ferramentas">
        <option value="name">Nome A-Z</option>
        <option value="reverse">Nome Z-A</option>
      </select>
    </div>

    <div id="cards" class="cards"></div>
  </section>

  <div class="security-note">
    <i class="bi bi-shield-lock"></i>
    <span>Ferramentas externas exigem avaliação de segurança e privacidade. A inclusão no catálogo não representa homologação corporativa.</span>
  </div>

</main>

<dialog id="previewDialog" aria-label="Prévia ampliada">
  <div class="dialog-head">
    <strong id="previewTitle"></strong>
    <button id="closePreview" type="button" aria-label="Fechar">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>
  <div id="previewContent"></div>
</dialog>

<footer>Daily Tools · Catálogo estático · Sem analytics próprios</footer>

</body>
</html>
